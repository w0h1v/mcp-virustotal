name: Bug report
description: Report a defect in mcp-virustotal
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys or sensitive indicators from private investigations. Use public, well-known samples in reproductions (for example the EICAR test file hash).

  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Include the exact error text.
    validations:
      required: true

  - type: textarea
    id: input
    attributes:
      label: Tool call
      description: 'The tool and arguments you used, for example get_file_relationship with a hash and the relationship dropped_files.'
      render: json

  - type: input
    id: version
    attributes:
      label: mcp-virustotal version
      description: Output of `npm ls -g @burtthecoder/mcp-virustotal`, or the commit you built from.
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version and OS
      description: For example, Node 22.11 on macOS 15 arm64.
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: MCP client and version
      description: For example, Claude Desktop, Claude Code, VS Code, or "unknown".
    validations:
      required: true

  - type: dropdown
    id: tier
    attributes:
      label: VirusTotal API tier
      options: [Public (free), Premium, Not sure]

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included API keys or sensitive indicators from private investigations.
          required: true
