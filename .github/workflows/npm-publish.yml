name: Publish to NPM

on:
  push:
    branches:
      - main
    # Skip changes that don't alter the published package.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'mkdocs.yml'
      - 'mkdocs_hooks.py'
      - '.github/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'CITATION.cff'
  release:
    types: [created]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Configure npm registry
        run: npm config set registry https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Bump version
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
        run: |
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          sed -i "s/\"version\": \".*\"/\"version\": \"$NEW_VERSION\"/g" server.json
          git add package.json package-lock.json server.json
          git commit -m "Bump version to $NEW_VERSION [skip ci]"
          git tag "v$NEW_VERSION"
          git push
          git push --tags

      - name: Build
        run: npm run build

      - name: Publish to NPM
        if: success()
        run: npm publish --provenance --access public

      # The registry checks that the published npm package's mcpName matches
      # server.json, so this runs after the npm publish. Auth is GitHub OIDC for
      # the io.github.<repo owner> namespace.
      - name: Publish to MCP Registry
        if: success()
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
          rm -f mcp-publisher mcp-publisher.tar.gz
