version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      dev-tools:
        dependency-type: "development"
    ignore:
      # @types/node should match the oldest supported Node (engines: >=20).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies"]
    ignore:
      # Odd-numbered Node releases are never LTS, and the "25.x" version pattern
      # did not match tags like "25-slim". Ignore every major bump instead and move
      # to the next even-numbered LTS by hand.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
